name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop installer (Electron)
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never
          Copy-Item dist\AgentHub-Setup-*.exe ..\AgentHub-Setup.exe
      - name: Build portable ZIP (classic, light)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage\runtime, stage\data | Out-Null
          Copy-Item server.js, README.md, get-info.js, install-autostart.js, agenthub-launch.vbs, agenthub-autostart.vbs, 'Start AgentHub.bat', 'Stop AgentHub.bat' stage\
          Copy-Item lib, public stage -Recurse
          Copy-Item data\seed-openrouter.json, data\seed-freelist.md stage\data\
          Copy-Item (Get-Command node.exe).Source stage\runtime\node.exe
          Compress-Archive -Path stage\* -DestinationPath AgentHub-Portable.zip -Force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentHub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            AgentHub-Setup.exe
            AgentHub-Portable.zip
